# Chillis — Dragon Nest Guide
# Static site served by nginx. TLS is terminated by Dokploy's proxy (Traefik)
# in front, with Cloudflare in front of that. Cache headers are tuned so a
# deploy is never served stale.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for Dokploy/Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # HTML is revalidated on every request, so new deploys appear immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets get a short TTL. The ?v=N cache-bust token in the HTML
    # still makes a deploy visible instantly when needed.
    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?|otf)$ {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
