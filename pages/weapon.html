<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weapon sets in Dragon Nest — a Chillis guide page.">
    <title>Weapon — Chillis Dragon Nest Guide</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('chillis-theme') || 'dark';
    </script>
    <link rel="stylesheet" href="../css/style.css?v=2">
    <script src="../js/site.js?v=2" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header id="site-header" class="site-header"></header>

    <main id="main">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <article class="container guide">
            <header class="guide-header cat-rates">
                <span class="category-label">Rates</span>
                <h1>Weapon</h1>
            </header>
            <div class="guide-body">
                <section class="guide-section">
                    <h2>Skila</h2>
                    <img src="https://i.imgur.com/gKeVnGO.png" alt="Skila weapon" loading="lazy" decoding="async">
                </section>
                <section class="guide-section">
                    <h2>TFDN / FDN (Tough Forest Dragon Nest)</h2>
                    <img src="https://i.imgur.com/FTBPoQZ.png" alt="TFDN / FDN weapon" loading="lazy" decoding="async">
                </section>
                <section class="guide-section">
                    <h2>Zephyr</h2>
                    <div class="media">
                        <figure>
                            <img src="https://i.imgur.com/zh6iC1j.png" alt="Incomplete Zephyr" loading="lazy" decoding="async">
                            <figcaption>Incomplete Zephyr</figcaption>
                        </figure>
                        <figure>
                            <img src="https://i.imgur.com/5TVN34j.png" alt="Zephyr (Gust Dragon Nest)" loading="lazy" decoding="async">
                            <figcaption>Zephyr (Gust Dragon Nest)</figcaption>
                        </figure>
                        <figure>
                            <img src="https://i.imgur.com/GfkRaba.png" alt="Tough Zephyr (Gust Dragon Nest Hardcore)" loading="lazy" decoding="async">
                            <figcaption>Tough Zephyr (Gust Dragon Nest Hardcore)</figcaption>
                        </figure>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
